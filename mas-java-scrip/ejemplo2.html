</head>
<body>
    <script>
        function factorial(numero) {

    if (numero === 0) {
        return 1;
    }

    let resultado = 1;

    
    for (let i = 1; i <= numero; i++) {

        
        resultado = resultado * i;
    }

    return resultado;
}


console.log(factorial(9));   
console.log(factorial(10));  
console.log(factorial(20));
    </script>
</body>
</html>
