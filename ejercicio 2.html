<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
function encontrarMaximoMinimo(numeros) {
    let max = numeros[0];
    let min = numeros[0];

    for (let i = 1; i < numeros.length; i++) {
        if (numeros[i] > max) {
            max = numeros[i];
        }

        if (numeros[i] < min) {
            min = numeros[i];
        }
    }

    return {
        maximo: max,
        minimo: min
    };
}

// Prueba
let numeros = [8, -3, 15, 2, -10, 20, 7];

let resultado = encontrarMaximoMinimo(numeros);

console.log("Arreglo:", numeros);
console.log("Máximo:", resultado.maximo);
console.log("Mínimo:", resultado.minimo);
    </script>
</body>
</html>
